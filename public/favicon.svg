<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0e1b"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <!-- Neural AI node graph icon with 'B' monogram -->
  <g filter="url(#glow)">
    <circle cx="32" cy="30" r="6" fill="#06b6d4" />
    <circle cx="68" cy="30" r="6" fill="#8b5cf6" />
    <circle cx="50" cy="52" r="8" fill="#3b82f6" />
    <circle cx="34" cy="72" r="6" fill="#8b5cf6" />
    <circle cx="66" cy="72" r="6" fill="#06b6d4" />
    
    <line x1="32" y1="30" x2="68" y2="30" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
    <line x1="32" y1="30" x2="50" y2="52" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
    <line x1="68" y1="30" x2="50" y2="52" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
    <line x1="50" y1="52" x2="34" y2="72" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
    <line x1="50" y1="52" x2="66" y2="72" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
    <line x1="34" y1="72" x2="66" y2="72" stroke="url(#grad)" stroke-width="2.5" opacity="0.8" />
  </g>
  <!-- Center pulsing spark -->
  <circle cx="50" cy="52" r="3" fill="#ffffff" />
</svg>